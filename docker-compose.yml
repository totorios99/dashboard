services:
  cockpit:
    build: .
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: "file:/data/cockpit.db"
      VAULT_ROOT: /vaults
      PHOTOS_DIR: /photos
    volumes:
      # SQLite database — persists across container restarts
      - cockpit_db:/data
      # Vault directories — mount your Obsidian vaults here
      - ${HOME}/Documents/The Alchemist's Atrium/cyber-brain:/vaults/cyber-brain:ro
      - ${HOME}/Documents/The Alchemist's Atrium/fitness-brain:/vaults/fitness-brain:ro
      - ${HOME}/Documents/The Alchemist's Atrium/spirituality-brain:/vaults/spirituality-brain:ro
      - ${HOME}/Documents/The Alchemist's Atrium/homelab-brain:/vaults/homelab-brain:ro
      - ${HOME}/Documents/The Alchemist's Atrium/central-brain:/vaults/central-brain
      # Photos directory
      - ./photos:/photos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cockpit_db:
